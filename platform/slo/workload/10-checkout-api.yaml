# A stand-in application service. go-httpbin is used because it can be told to
# return a specific status code or to stall for a specific duration, which is
# what makes the error-budget demo reproducible instead of anecdotal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: slo-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/team: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/team: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpbin
          image: ghcr.io/mccutchen/go-httpbin:v2.15.0
          args: ["-port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status/200
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: slo-demo
  labels:
    app.kubernetes.io/name: checkout-api
spec:
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The Ingress name is the stable identity every SLI query filters on
# (ingress="slo-demo"). Renaming it silently breaks every recording rule, so
# the name is treated as a contract.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slo-demo
  namespace: slo-demo
spec:
  ingressClassName: nginx
  rules:
    - host: checkout.slo-demo.svc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout-api
                port:
                  number: 80
