# Cluster-wide secret source: AWS Secrets Manager, authenticated through the ESO
# controller's IRSA ServiceAccount (no static keys). Any namespace can reference
# this store from an ExternalSecret; the IRSA role is scoped to the adp/* secret
# path, so the store can only read this platform's secrets.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
