# Demo: pull the Secrets Manager secret adp/dev/demo-db into a native Kubernetes
# Secret named demo-db, in the team-apps namespace. The developer writes this
# eight-line reference; ESO does the fetch over IRSA and keeps it in sync. No
# credential is ever in Git or in the manifest.
#
#   kubectl create namespace team-apps   # if it does not exist
#   kubectl apply -f examples/external-secret.yaml
#   kubectl get externalsecret demo-db -n team-apps      # SecretSynced=True
#   kubectl get secret demo-db -n team-apps -o jsonpath='{.data.username}' | base64 -d
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-db
  namespace: team-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: demo-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: adp/dev/demo-db
        property: username
    - secretKey: password
      remoteRef:
        key: adp/dev/demo-db
        property: password
