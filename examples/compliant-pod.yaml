# A pod that satisfies every admission policy in an enforced namespace:
#   - app.kubernetes.io/team        (require-team-label)
#   - app.kubernetes.io/cost-center (require-cost-center-label, cc-NNNN)
#   - runAsNonRoot + no privilege escalation, resource limits, pinned tag
#     (baseline-hardening)
apiVersion: v1
kind: Pod
metadata:
  name: compliant-nginx
  labels:
    app.kubernetes.io/team: payments
    app.kubernetes.io/cost-center: cc-1001
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
