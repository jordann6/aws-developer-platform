name: Guardrails

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level default stays credential-free. The elevated permissions live
# on the plan job alone, so the static gates keep the floor they were designed
# for. This matters because of the pull_request trigger above: static runs
# Terraform authored by whoever opened the PR, and it must never sit in a job
# that can mint an OIDC token.
permissions:
  contents: read

jobs:
  static:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1
    with:
      terraform_dir: terraform
      # 3 pre-existing findings are baselined. New findings still block.
      checkov_baseline: terraform/.checkov.baseline

  # Needs an OIDC role before it can run. Fill in aws_role_arn and remove the
  # `if: false` guard to turn on plan, destroy guard, and cost diff.
  #
  # These permissions are what tf-plan.yml declares. GitHub resolves `uses:`
  # and checks them before it evaluates `if:`, so they are required even while
  # the job is gated off. Omitting them fails the whole run at startup, with no
  # logs and no jobs, on every push.
  plan:
    if: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@v1
    with:
      terraform_dir: terraform
      aws_role_arn: ""
      aws_region: us-east-2
      enable_infracost: false
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
