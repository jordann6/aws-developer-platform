name: Guardrails

on:
  push:
    branches: [main]
  pull_request:

# tf-plan.yml declares id-token: write and pull-requests: write. A reusable
# workflow cannot request permissions the caller has not granted, and GitHub
# resolves `uses:` before it evaluates the job's `if:`, so gating the plan job
# off does not avoid the check. Without these two lines every push fails at
# startup with no logs and no jobs.
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  static:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1
    with:
      terraform_dir: terraform
      # 3 pre-existing findings are baselined. New findings still block.
      checkov_baseline: terraform/.checkov.baseline

  # Needs an OIDC role before it can run. Fill in aws_role_arn and remove the
  # `if: false` guard to turn on plan, destroy guard, and cost diff.
  plan:
    if: false
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@v1
    with:
      terraform_dir: terraform
      aws_role_arn: ""
      aws_region: us-east-2
      enable_infracost: false
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
